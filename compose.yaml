services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: imdconecta
      POSTGRES_USER: imdconecta_user
      POSTGRES_PASSWORD: ${DB_PASSWORD:-imdconecta_dev}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U imdconecta_user -d imdconecta"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - pgdata:/var/lib/postgresql/data

  app:
    build: ./backend
    depends_on:
      db:
        condition: service_healthy
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/imdconecta
      DB_USERNAME: imdconecta_user
      DB_PASSWORD: ${DB_PASSWORD:-imdconecta_dev}
    ports:
      - "8080:8080"

volumes:
  pgdata:
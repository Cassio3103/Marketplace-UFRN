name: CI

on:
  push:
  pull_request:
    branches: [main]

jobs:
  build-e-testes:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: ci_user
          POSTGRES_PASSWORD: ci_password
          POSTGRES_DB: imdconecta
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ci_user -d imdconecta"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DB_USERNAME: ci_user
      DB_PASSWORD: ci_password

    defaults:
      run:
        working-directory: backend

    steps:
      - name: Baixar o código
        uses: actions/checkout@v4

      - name: Instalar o Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Compilar e rodar os testes
        run: ./mvnw -B verify